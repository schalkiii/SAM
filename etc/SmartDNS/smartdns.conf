# DNS 服务器监听的 IP 和端口，支持监听多个 IP 和端口
# 默认只监听回环；LAN_ACCESS=true 时 service/sd.sh 会改写为 [::]:3721
bind 127.0.0.1:3721

# Bootstrap 服务器
server 223.5.5.5 -bootstrap-dns -exclude-default-group
server 223.6.6.6 -bootstrap-dns -exclude-default-group
server 1.12.12.12 -bootstrap-dns -exclude-default-group
server 120.53.53.53 -bootstrap-dns -exclude-default-group

#上游服务器
server 180.184.1.1
server 180.184.2.2
server-https https://1.12.12.12:443/dns-query
server-https https://120.53.53.53:443/dns-query
server-https https://223.5.5.5:443/dns-query
server-https https://223.6.6.6:443/dns-query

# 域名预读
prefetch-domain yes

# 乐观缓存
serve-expired yes

# DNS 缓存大小
# 0 表示无缓存，-1表示根据内存大小自动调整
# 缓存条目数上限
# 原为 -1(按系统内存自动放大)，手机上会吃掉可观内存，
# 是系统内存紧张时 LMKD 优先回收本模块进程的诱因之一，改为固定上限
cache-size 4096

# DNS 缓存持久化
cache-persist yes
cache-file data/smartdns.cache
cache-checkpoint-time 3600

# 响应过期请求时使用的 TTL 值
# 语义: 缓存条目已过期但仍在保留期内时，返回给客户端的 TTL。
# 官方推荐 3~5 秒 —— 客户端很快就会再来查，而此时 SmartDNS 后台刷新已完成，
# 客户端拿到的是新 IP。这个值不能调大，否则客户端会长时间拿着可能已失效的 IP。
serve-expired-reply-ttl 5

# 速度检查模式
# 保持官方默认: response-mode first-ping 依赖 ping 探测结果来挑最优 IP，
# 去掉 ping 会让 first-ping 退化。冷查询慢的问题改由 rr-ttl-min 解决
# (提高缓存命中率后，冷查询本身就不常发生)
speed-check-mode ping,tcp:80,tcp:443

# 响应模式（first-ping|fastest-ip|fastest-response）
response-mode first-ping

# 双栈 IP 优选
dualstack-ip-selection yes
dualstack-ip-selection-threshold 15

# 所有资源记录的 TTL
# rr-ttl-min 是缓存条目的最短存活时间：
# 设成 5 秒会把上游返回的 TTL 一律压到 5 秒，缓存几乎等于没有，
# 5 秒后每个域名都要重新解析 + 重新测速(first-ping 下每次冷查询都要等 ping)，
# 这就是 AGH 面板上看到 3721 上游延迟 100ms 的直接原因。
# 官方 FAQ 建议 10~30 分钟，取下沿 600 秒：
# 配合 prefetch-domain(到期前 5 秒预取) 与 serve-expired(过期仍可返回并后台刷新)，
# 缓存条目实际不会真的过期，同时又不会让 CDN 切换后的旧 IP 停留过久。
rr-ttl-min 600
rr-ttl-max 86400
rr-ttl-reply-max 86400

# 日志配置
# info 会记录每次查询，手机长期运行会产生大量磁盘写入；日常用 notice，
# 排障时再临时改为 info
log-level notice
log-file ../../tmp/smartdns.log
log-size 512k
log-num 1

# 数据目录
data-dir data

# WebUI
plugin smartdns_ui.so
smartdns-ui.www-root wwwroot
smartdns-ui.ip http://127.0.0.1:6080
smartdns-ui.token-expire 600
smartdns-ui.max-query-log-age 86400
smartdns-ui.enable-terminal no
smartdns-ui.enable-cors yes
smartdns-ui.user root
smartdns-ui.password root
