# SmartDNS
# 启用/禁用(true/false)
SMARTDNS_ENABLE=true

# AdGuardHome
# 启用/禁用(true/false)
AGH_ENABLE=true

# AdGuardHome DNS 端口
AGH_DNS_PORT=5300

# 阻断 ipv6 DNS
# 启用/禁用(true/false)
BLOCK_IPV6_DNS=true

# Mihomo
# 启用/禁用(true/false)
MIHOMO_ENABLE=true

# Mihomo ipv6 代理
# 启用/禁用(true/false)
MIHOMO_IPV6=true

# Mihomo DNS 端口
MIHOMO_DNS_PORT=1053

# Mihomo DNS 模式
# fake-ip / redir-host
MIHOMO_DNS_MODE=fake-ip

# TUN 网卡
TUN_DEVICE=Meta

# 使用 iptables 拦截 ip
# 启用/禁用(true/false)
IP_IPTABLES=false

# 屏蔽 App 广告文件
# 启用/禁用(true/false)
# 会清空并锁定部分 App 的广告缓存目录(chattr +i)，卸载时会自动恢复
AD_BLOCK_ENABLE=true

# host
# 启用/禁用(true/false)
HOST_ENABLE=true

# 定时执行 启用/禁用(true/false)
# 配置路径: /data/adb/modules/SAM/etc/crontabs/root
CRONTAB_ENABLE=false

# 模块 DNS 结构模式
# 1: SmartDNS > Mihomo > AdGuardHome
# 2: SmartDNS > AdGuardHome > Mihomo 
MODULE_DNS_MODE=2

# 直通模式
# 开启/禁用(true/false)
# 开启后撤销 DNS 劫持规则，系统改用网络下发的 DNS；服务进程与 WebUI 保持运行
# 适用于必须使用指定 DNS 的 WiFi(校园网、认证热点、企业内网)
BYPASS_ENABLE=false

# SmartDNS 响应模式
# first-ping: 上游时延 + ping 时延，综合最快
# fastest-ip: 等全部 IP 测速完成再返回，最慢但选路最准
# fastest-response: 不等测速，延迟最低，但返回的 IP 可能不是最快
SMARTDNS_RESPONSE_MODE=first-ping

# SmartDNS 测速方式
# none / ping / tcp:443 / ping,tcp:80,tcp:443
# 移动网络下 ICMP ping 常被限制，卡住的就是这一段；建议先试 tcp:443，追求最低延迟用 none
SMARTDNS_SPEED_CHECK=ping,tcp:80,tcp:443

# 缓存 TTL 下限(秒)
# 上游返回的 TTL 低于该值时按该值缓存，能显著减少"冷查询"，从而少触发测速
SMARTDNS_TTL_MIN=600

# 双栈 IP 优选
# 启用/禁用(true/false)
# 启用时会对 A/AAAA 做时延比较；如果你不用 IPv6，关掉可少一次等待
SMARTDNS_DUALSTACK=true

# 允许局域网访问
# 启用/禁用(true/false)
# 关闭时 AdGuardHome WebUI、Mihomo 控制端口、各 DNS 只监听 127.0.0.1，
# 同一 WiFi 下的其它设备无法访问；需要在电脑上管理时再打开
LAN_ACCESS=false

# 切换模式/直通后刷新网络
# 启用/禁用(true/false)
# 保存配置时若改动了直通开关、DNS 结构模式或 DNS 端口，会开关一次飞行模式，
# 让系统和 App 立刻重新发起 DNS 查询。副作用: WiFi 会短暂断开重连
NETWORK_REFRESH=true

# Mihomo配置卸载备份 启用/禁用(true/false)
# 存放路径: /sdcard/Mihomo配置.yaml
BACKUP_CONF=true

# 排除节点
# 在智能选择、自动选择、负载均衡和故障转移内排除节点，有多个节点用|分隔
# 示例: EXCLUDE_NODE="节点1|节点2|节点3"
EXCLUDE_NODE=""

# 节点订阅地址
# 注意: 地址要用双引号，每个地址之间用空格隔离开来，无订阅则无法启动服务
# 示例: SUB_URL=("订阅地址1" "订阅地址2" "订阅地址3")
SUB_URL=()

# 白名单/黑名单
# 启用/禁用(true/false)
# 启用则使用白名单，禁用则使用黑名单，两者无法同时使用，黑白名单只配置 Tun 规则，不再自动配置路由规则
# 白名单配置路径: /data/adb/modules/SAM/etc/app_whitelist.prop
# 黑名单配置路径: /data/adb/modules/SAM/etc/app_blacklist.prop
ENABLE_WHITELIST=false

# 白名单模式
# 1: 使用默认 Tun 包含配置
# 2: 获取所有用户 App，排除白名单内的 App，加入 Tun 排除配置
WHITELIST_MODE=1

# 黑名单WIFI
# 将 WIFI 名称填入，检测到当前所连接 WIFI 有在名单内将停止服务，断开WIFI或连接不在名单内的WIFI，将启动服务
# 注意: WIFI名要用双引号，每个WIFI名之间用空格隔离开来，无内容则无法启动监控
BLACKLIST_WIFI=()
