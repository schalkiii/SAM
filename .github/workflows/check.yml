name: module-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 设备上的 sh 是 mksh，bash 通过不代表能跑
      - name: 安装 mksh
        run: sudo apt-get update && sudo apt-get install -y mksh

      # --no-write: 只校验，不改仓库里的文件；CRLF 现在也会让 --check 失败
      - name: 检查模块
        run: python tools/pack_module.py --check --no-write

      - name: WebUI JavaScript 语法检查
        run: node --check webroot/js/main.js && node --check webroot/js/kernelsu.js

      - name: 广告屏蔽回归测试
        run: python tools/test_ad_sh.py

      # 配置接口 / 归档安全 / 能力探测 / 备份语义回归
      # 这些用例从脚本中抽取真实函数或搭临时模块目录，不依赖设备环境
      - name: 定时任务校验回归测试
        run: python tools/test_cron_validate.py

      - name: 归档安全校验回归测试
        run: python tools/test_tar_guard.py

      - name: owner 能力探测回归测试
        run: python tools/test_owner_probe.py

      - name: 备份语义回归测试
        run: python tools/test_backup_semantics.py
